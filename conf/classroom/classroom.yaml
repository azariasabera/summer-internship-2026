# conf/classroom/classroom.yaml

model_ckpt: facebook/wav2vec2-base
sample_rate: 16000
canonical_order: [neutral, sadness, happiness, anger]

splits_dir: ${paths.splits_root}
datasets_dir: ${paths.datasets_root}
fesc_old_prefix: ${teachers.fesc_old_prefix}
fesc_new_prefix: ${paths.datasets_root}/FESC/

fesc_session_map: ${teachers.fesc_session_map}

excluded_videos: [1B3261]

seed: ${seed}
weight_decay: 0.01
max_duration_sec: 20.0

audio_root: ${paths.chunk_audio_dir}
csv_root: ${paths.annotation_root}
base_checkpoint: ${paths.mtkd_student_ckpt}

variant: head_only            # full | head_only
use_class_weight: true
use_confidence_weight: true
augment_fesc: false

augment_strategy: "cap" # cap | adaptive

fesc_output_dir: ${paths.fesc_contaminated_dir}
augment_classes: [sadness, anger]
augment_cap_multiplier: 2.5
noise_extra_videos: [1B3261]
noise_n_sources: [2, 3]

augment_adaptive_alpha: 5.0

cv: loto
internal_val_frac: 0.0
epochs: 5
lr: null                      # I used 1e-4 for head_only, 2e-5 for full
batch_size: 8
output_dir: ${paths.generated_root}/classroom_finetune
save_model_dir: ${paths.classroom_finetune_dir} # null  # if null = do not save (original default)

use_rir: false # if true, FESC samples will be convolved with a random RIR from the rir_dir below in addition to the noise contamination