# conf/paths/paths.yaml

# All filesystem paths. Override per machine without touching code.
# Prefer symlinks under data/ so recipes stay portable.

data_root: data
generated_root: generated
log_root: logs
tmp_root: tmp
doc_root: doc
checkpoint_root: final_models

# Classroom media (point these at your local copies or symlinks)
audio_root: ${paths.data}/classroom_audio
video_root: ${paths.data}/classroom_video

# Chunk
chunk_meta_dir: ${paths.generated_root}/chunks # json form for annotation_root
chunk_meta_fixed_dir: ${paths.generated_root}/chunks_fixed

# Annotation CSVs (one per video: <video_id>.csv)
prepared_annotation_root: ${paths.data}/annotations # my already prepared annotations in csv format
annotation_root: ${paths.generated_root}/annotations

# Noise for augmentation (full pooled collection)
noise:
  noise_extract_path: ${paths.data}/noise/full_noise.wav
  noise_extract_save_dir: ${paths.generated_root}/noise

# Prediction JSONs produced by MTKD inference
prediction_root: ${paths.generated_root}/predictions

# Pooled embeddings (per-video folders with pooled.npy + metadata)
embedding_root: ${paths.generated_root}/embeddings

# Text-sentiment JSONs
sentiment_fi: ${paths.generated_root}/sentiment/sentiment_fi.json
sentiment_en: ${paths.generated_root}/sentiment/sentiment_en.json

# MTKD related
teacher_ckpt_dir: ${paths.checkpoint_root}/teachers
student_ckpt_dir: ${paths.checkpoint_root}/mtkd
mtkd_student_ckpt: ${paths.student_ckpt_dir}/MTKD_Multilingual_FI_S6.pth
classroom_finetune_dir: ${paths.checkpoint_root}/classroom_finetuned
noise_retrain_dir: ${paths.checkpoint_root}/noise_retrained

# FESC-contaminated augmentation audio cache
fesc_contaminated_dir: ${paths.generated_root}/fesc_contaminated

# --- Benchmark dataset splits (FESC / IEMOCAP / CaFE) ---
# splits_root: the json train/test/dev split files (data.py's SPLITS_DIR)
# datasets_root: the actual resampled audio referenced by those splits (DATASETS_DIR)
# cafe_root: CaFE has its own separate audio root (config.CAFE_DIR)
splits_root: ${paths.data}/datasplits
datasets_root: ${paths.data}/datasets
cafe_root: ${paths.data}/datasets/cafe

analysis:
  analysis_output_dir: ${paths.generated_root}/analysis
  plot_save_dir: ${paths.generated_root}/analysis/emotion_arcs

confidence:
  confidence_output_dir: ${paths.generated_root}/confidence

probes:
  child_speech_out_dir: ${paths.generated_root}/probes/child_speech
  feature_fusion_out_dir: ${paths.generated_root}/probes/feature_fusion