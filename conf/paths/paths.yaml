# conf/paths/paths.yaml

# All filesystem paths. Override per machine without touching code.
# Prefer symlinks under data/ so recipes stay portable.

# Classroom media (point these at your local copies or symlinks)
audio_root: data/classroom_audio
video_root: data/classroom_video

# Annotation CSVs (one per video: <video_id>.csv)
prepared_annotation_root: data/annotations # my already prepared annotations in csv format
annotation_root: generated/annotations

# Prediction JSONs produced by MTKD inference
prediction_root: generated/predictions

# Pooled embeddings (per-video folders with pooled.npy + metadata)
embedding_root: generated/embeddings

# Text-sentiment JSONs
sentiment_fi: generated/sentiment/sentiment_fi.json
sentiment_en: generated/sentiment/sentiment_en.json

# Model checkpoints
checkpoint_root: final_models
teacher_ckpt_dir: ${paths.checkpoint_root}/teachers
student_ckpt_dir: ${paths.checkpoint_root}/mtkd
mtkd_student_ckpt: ${paths.student_ckpt_dir}/MTKD_Multilingual_FI_S6.pth
classroom_finetune_dir: ${paths.checkpoint_root}/classroom_finetuned
noise_retrain_dir: ${paths.checkpoint_root}/noise_retrained

# Outputs
chunk_meta_dir: generated/chunks
chunk_meta_fixed_dir: generated/chunks_fixed
generated_root: generated
log_dir: logs
tmp_dir: tmp

# Noise for augmentation (full pooled collection)
noise_path: data/noise/full_noise.wav

# FESC-contaminated augmentation audio cache
fesc_contaminated_dir: generated/fesc_contaminated

# --- Benchmark dataset splits (FESC / IEMOCAP / CaFE) ---
# splits_root: the json train/test/dev split files (data.py's SPLITS_DIR)
# datasets_root: the actual resampled audio referenced by those splits (DATASETS_DIR)
# cafe_root: CaFE has its own separate audio root (config.CAFE_DIR)
splits_root: data/datasplits
datasets_root: data/datasets
cafe_root: data/datasets/cafe