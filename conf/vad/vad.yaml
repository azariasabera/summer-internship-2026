# conf/vad/vad.yaml

# VAD + segment refinement parameters.
# These values produced the segment boundaries used in the progress report.
# Changing them will change chunk durations and downstream metrics.

# Silero VAD
threshold: 0.5
min_speech_duration_ms: 250
min_silence_duration_ms: 300
speech_pad_ms: 100
sample_rate: 16000

# Custom refinement (must stay identical for reproducibility)
max_merge_gap: 2.0
min_speech_ratio: 0.5
min_speech_duration: 2.0
min_non_speech_duration: 2.0
max_segment_duration: 10.0
overlap: 1.0