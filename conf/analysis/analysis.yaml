# conf/analysis/analysis.yaml

# Shared across evaluate-classroom / acoustic-by-emotion / temporal
mtkd_json: ${paths.infer.infer_output_path} # null          # required: MTKD prediction JSON path
three_class: false       # evaluate-classroom: also report the 3-class polarity comparison
audio_root: ${paths.audio_root} # null         # acoustic-by-emotion: full per-video audio (not chunks) -- loudness skipped if unset
output_dir: ${paths.analysis.analysis_output_dir}

annotation_dir: ${paths.annotation_root}

# noise-analysis (report Table 21)
# noise_conditions: null   # mapping of condition name -> prediction json path
noise_conditions:
  original: ${paths.infer.infer_output_path}
  deepfilternet_15dB: generated/mtkd_inference/infer_result_15dB.json
  deepfilternet_0dB: generated/mtkd_inference/infer_result_0dB.json
  spectral_subtraction: generated/mtkd_inference/infer_result_spectral.json
  retrain_5_15dB: generated/mtkd_inference/infer_result_5_15.json
  retrain_10_25dB: generated/mtkd_inference/infer_result_10_25.json
  retrain_15_30dB: generated/mtkd_inference/infer_result_15_30.json
  
check_non_speech: false  # also report each condition's non-speech-chunk prediction distribution

emotion_arc:
  video: 1B2251  # specify the videoID
  plot_save_dir: ${paths.analysis.plot_save_dir}
  ma:
    window: 5
  gaussian:
    sigma: 2.0
    radius: null  # if None, radius = round(sigma*truncate), and kernel-width is 2*radius+1
    truncate: 4.0