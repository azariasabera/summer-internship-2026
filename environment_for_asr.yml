# This environment contains specific versions of libraries, including PyTorch, that can affect
# Whisper's outputs. To obtain consistent ASR transcriptions and translations across chunks,
# create this environment and activate it when running tea apply-asr.
# This environment may also be required for other analysis-related tasks. I used this environment
# for my analysis, while the main environment (tea) was used for Triton tasks such as training,
# inference, and model fine-tuning.

